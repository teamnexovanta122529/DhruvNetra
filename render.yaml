services:
  - type: web
    name: dhruvnetra-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: heuristic
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_STATION
        value: MAITRI
      - key: ENVIRONMENT_REFRESH_SECONDS
        value: 300
    healthCheckPath: /api/health
